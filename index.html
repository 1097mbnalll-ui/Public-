<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EDE7FF" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="مدار — مساعد شخصي لتنظيم الجامعة والعمل والحياة. بياناتك على جهازك فقط." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="مدار" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <script src="./theme-boot.js"></script>
    <title>مدار</title>
    <style>
      /* the opening logo: shown before anything loads, then lifts away (see main.tsx) */
      #splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: var(--boot-bg, #FFF4E3); }
      #splash .sp { width: 104px; height: 104px; animation: sp-in 0.6s cubic-bezier(0.32, 0.72, 0, 1) both; }
      #splash .sp svg { width: 100%; height: 100%; display: block; }
      #splash.out { animation: sp-fade 0.42s ease 0.08s forwards; pointer-events: none; }
      #splash.out .sp { animation: sp-out 0.46s cubic-bezier(0.32, 0.72, 0, 1) forwards; }
      /* the sun comes round its orbit as the logo arrives */
      #splash .sun { transform-box: view-box; transform-origin: 256px 256px; animation: sp-orbit 0.9s cubic-bezier(0.32, 0.72, 0, 1) both; }
      @keyframes sp-orbit { from { transform: rotate(-200deg); } }
      @keyframes sp-in { from { transform: scale(0.72); opacity: 0; } }
      @keyframes sp-out { to { transform: scale(1.4); opacity: 0; } }
      @keyframes sp-fade { to { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { #splash .sp, #splash.out .sp, #splash .sun { animation: none; } #splash.out { animation-duration: 0.15s; animation-delay: 0s; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><div class="sp"><svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><rect width="512" height="512" rx="115" fill="#2A1A14"/><circle cx="256" cy="256" r="128" fill="none" stroke="#FFF4E3" stroke-width="34"/><g class="sun"><circle cx="366" cy="190" r="40" fill="#F2B53A" stroke="#2A1A14" stroke-width="14"/></g></svg></div></div>
    <div id="root"></div>
    <noscript>يحتاج «مدار» إلى تفعيل JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
